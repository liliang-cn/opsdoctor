# Example domain config.
# This is ONE worked example of an opsdoctor domain. Any project copies this
# file, edits it for their own product, and points opsdoctor at it via
# OPSDOCTOR_DOMAIN_FILE — no platform source changes needed. The example below models a
# generic Linux storage/HA product; replace every field with your own.

name = "Example storage/infra domain"
title = "Example knowledge"

persona = '''
You are an expert SRE copilot for a software-defined storage and high-availability
product running on Linux clusters.

How you work:
- Reason step by step (ReAct). When you need live system state, call the read-only
  probe tools. They are strictly read-only.
- Ground every diagnosis in the knowledge base: call knowledge_search for the
  relevant docs, states, recovery procedures, and source error strings.
- When you recommend a fix, give the exact commands in a fenced code block.

Safety (non-negotiable):
- A deterministic safety wall, independent of you, blocks data-destroying commands
  (wipefs, dd to a device, mkfs, lvremove/lvreduce, vgremove, zfs/zpool destroy, etc.).
- If a fix genuinely requires such a command, do NOT present it as a one-liner to run.
  Explain the risk, the affected volumes, the backup precondition, and state clearly
  that it requires explicit operator confirmation and an unlock key.
'''

# The ontology vocabulary. It is not documentation: three things read it.
#
#   1. The ingest-time extractor is told "Use ONLY these types", once per chunk.
#      Nothing reconciles one chunk's spelling with the next one's, so a
#      vocabulary that is not closed here is not closed at all.
#   2. Retrieval expands one hop along relation_types, case-widened. An edge type
#      that is not declared is stored and never walked, which looks exactly like
#      having no graph.
#   3. entity_types are registered with cortexdb as object types implementing a
#      `DomainEntity` interface. A node of a declared type is offered as a graph
#      seed, and takes a neighbour slot, ahead of one that is not — imported code
#      nodes and whatever the model invented stay reachable, just behind.
#
# `opsdoctor doctor` reports what the graph holds that is not declared here, what
# is declared and never appeared, and whether the graph was extracted under an
# older version of these lists.
entity_types = [
  "Cluster", "Node", "StoragePool", "ResourceGroup", "Resource", "Volume",
  "KernelModule", "ErrorCode", "CLI_Command", "ConfigParameter", "State",
]

relation_types = [
  "DEPLOYED_ON", "CONTAINS", "MANAGES", "DEPENDS_ON", "TRIGGERED_BY",
  "RESOLVES", "MUTUALLY_EXCLUSIVE", "TRIGGERED_IN_STATE", "DEFINED_IN",
]

# Regex sources (TOML literal strings preserve backslashes). Group 1 = message.
# These mine the log/error string literals an operator actually sees, so a
# real-world error line can be traced back to its source.
error_patterns = [
  '(?:printk|pr_err|pr_warn|pr_crit|dev_err|dev_warn)\s*\([^"]*"([^"]{8,})"',
  'fprintf\s*\(\s*stderr\s*,\s*"([^"]{8,})"',
  '\blog_(?:err|error|warn|warning|crit)\s*\([^"]*"([^"]{8,})"',
  '\bperror\s*\(\s*"([^"]{6,})"',
  '(?:new\s+\w*Exception|LOG\.(?:error|warn)|errorReporter\.\w+|reportError)\s*\([^"]*"([^"]{8,})"',
]

# Source/doc repositories to ingest into the knowledge graph. Add your project's
# repos here; opsdoctor clones, understands, and imports each.
repos = []

# Deterministic destructive-command blocks (LLM-independent). The platform owns
# the mechanism; these rules are domain-specific. Drop them and nothing is blocked.
# The ones below are universal Linux storage operations — keep what applies to
# your product and add your own CLI's dangerous verbs.
[[red_lines]]
id = "wipefs"
severity = "CRITICAL"
pattern = '\bwipefs\b'
reason = "wipefs erases filesystem signatures; data irreversibly lost"

[[red_lines]]
id = "dd-to-device"
severity = "CRITICAL"
pattern = '\bdd\b.*\bof=/dev/'
reason = "dd to a block device overwrites raw disk data"

[[red_lines]]
id = "mkfs"
severity = "CRITICAL"
pattern = '\bmkfs(\.\w+)?\b'
reason = "mkfs rebuilds a filesystem, wiping the target device"

[[red_lines]]
id = "lvremove"
severity = "CRITICAL"
pattern = '\blvremove\b'
reason = "lvremove deletes a logical volume; data on it is lost"

[[red_lines]]
id = "vgremove"
severity = "CRITICAL"
pattern = '\bvgremove\b'
reason = "vgremove deletes a volume group"

[[red_lines]]
id = "zfs-destroy"
severity = "CRITICAL"
pattern = '\bzfs\b.*\bdestroy\b'
reason = "zfs destroy deletes a dataset/volume/snapshot"

[[red_lines]]
id = "zpool-destroy"
severity = "CRITICAL"
pattern = '\bzpool\b.*\bdestroy\b'
reason = "zpool destroy destroys an entire storage pool"

[[probes]]
name = "lsblk"
description = "Show host block devices and topology."
argv = ["lsblk"]

[[probes]]
name = "vgs"
description = "Show LVM volume groups and free space."
argv = ["vgs"]

[[probes]]
name = "zpool_status"
description = "Show ZFS pool health and device status."
argv = ["zpool", "status"]

# ---------------------------------------------------------------------------
# Relation ends and flags. A [[relation]] says what may sit on each side of an
# edge type, which the flat relation_types list cannot — and, for the three
# flags below, whether alchemy should stop the job when two records disagree.
#
# These blocks live BELOW every top-level key on purpose. In TOML a table
# header ends the top-level section, so a [[relation]] written next to
# relation_types — where it reads best — silently swallows error_patterns and
# probes into itself. Nothing fails; the domain just comes up with none.
#
# The flags matter only when OPSDOCTOR_ALCHEMY_ADDR is set. They are the whole
# of what alchemy can refuse for, and both defaults are wrong for some
# relation in every real vocabulary:
#
#   both_ways        — an edge of this type may run either way between one
#                      pair, and both may hold at once. Undeclared, alchemy
#                      reads the pair as two sources contradicting each other
#                      and WITHHOLDS the document's whole graph. Every
#                      symmetric relation needs this or it stops ingest.
#   at_most_one_out  — a node may be on the `from` end of at most one edge of
#   at_most_one_in     this type; `_in` says the same for the `to` end. They
#                      are how the vocabulary says a fact can go out of date.
#                      Without them a corpus that learns a resource moved
#                      holds both edges and reports no disagreement at all.
#
# A second edge on a constrained end is a question for a person, not a silent
# replacement: alchemy holds the job rather than preferring the later record,
# because a correction can be the mistake.
# ---------------------------------------------------------------------------

# A resource is Primary on one node at a time — that is what the promoter is
# for, and it is the fact most likely to be stale in a document.
[[relation]]
name = "DEPLOYED_ON"
from = "Resource"
to   = "Node"
at_most_one_out = true

# Replication runs between two peers and both directions are true at once.
# Without both_ways this one relation withholds the graph of every document
# that describes a healthy link.
[[relation]]
name = "MUTUALLY_EXCLUSIVE"
from = ["Resource", "ConfigParameter", "State"]
to   = ["Resource", "ConfigParameter", "State"]
both_ways = true

# CONTAINS is deliberately left undeclared. It is a CHAIN — a cluster contains
# a pool contains a volume — so the middle term is on both ends, and ends that
# overlap without being identical leave an edge between two middle terms
# reading both ways. `opsdoctor domain` refuses exactly that, which is how you
# find out; the flat relation_types entry above still extracts and expands it.
